services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumen}
      POSTGRES_USER: ${POSTGRES_USER:-lumen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lumen} -d ${POSTGRES_DB:-lumen}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      # Liga as travas de producao do backend (recusa subir sem segredo forte / com segredo padrao).
      # Precisa estar aqui: so o que este bloco lista chega ao container, o .env.production nao basta.
      NODE_ENV: production
      APP_URL: ${APP_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lumen}?schema=public
      REDIS_URL: redis://redis:6379
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_SWAGGER_ENABLED: ${APP_SWAGGER_ENABLED:-true}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-lumen.refreshToken}
      AUTH_REFRESH_COOKIE_DOMAIN: ${AUTH_REFRESH_COOKIE_DOMAIN}
      AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/api/v1/auth}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-true}
      AUTH_REFRESH_COOKIE_SAME_SITE: ${AUTH_REFRESH_COOKIE_SAME_SITE:-lax}
      AUTH_MFA_ENABLED: ${AUTH_MFA_ENABLED:-false}
      AUTH_MFA_ENCRYPTION_SECRET: ${AUTH_MFA_ENCRYPTION_SECRET}
      AUTH_MFA_ISSUER: ${AUTH_MFA_ISSUER:-LUMEN}
      AUTH_MFA_CHALLENGE_EXPIRES_IN_SECONDS: ${AUTH_MFA_CHALLENGE_EXPIRES_IN_SECONDS:-300}
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_EMAIL_LINK_SECRET: ${AUTH_EMAIL_LINK_SECRET}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-60}
      AUTH_EMAIL_VERIFICATION_TTL_HOURS: ${AUTH_EMAIL_VERIFICATION_TTL_HOURS:-48}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      SELAH_ASSISTANT_ENABLED: ${SELAH_ASSISTANT_ENABLED:-false}
      SELAH_BASE_URL: ${SELAH_BASE_URL:-}
      SELAH_API_KEY: ${SELAH_API_KEY:-}
      SELAH_SOURCE_APP: ${SELAH_SOURCE_APP:-LumenBack}
      SELAH_ASSISTANT_ROUTE: ${SELAH_ASSISTANT_ROUTE:-/v1/adapters/lumen/life-assistant/chat}
      SELAH_RECEIPT_ROUTE: ${SELAH_RECEIPT_ROUTE:-/v1/adapters/lumen/receipt-parser/parse}
      SELAH_TIMEOUT_MS: ${SELAH_TIMEOUT_MS:-50000}
      SELAH_RECEIPT_TIMEOUT_MS: ${SELAH_RECEIPT_TIMEOUT_MS:-60000}
      SELAH_FALLBACK_TIMEOUT_MS: ${SELAH_FALLBACK_TIMEOUT_MS:-15000}
      # off (padrao) | fallback: a IA so entra quando o motor de regras nao entende a frase.
      ASSISTANT_AI_MODE: ${ASSISTANT_AI_MODE:-off}
      SELAH_PULSE_HOUR: ${SELAH_PULSE_HOUR:-7}
      SELAH_ESCALATION_DAYS: ${SELAH_ESCALATION_DAYS:-3}
      AUTH_REFRESH_REUSE_GRACE_SECONDS: ${AUTH_REFRESH_REUSE_GRACE_SECONDS:-30}
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-LUMEN}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      RESEND_TIMEOUT_MS: ${RESEND_TIMEOUT_MS:-10000}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_TIMEOUT_MS: ${ASAAS_TIMEOUT_MS:-10000}
      # Canais de conversa: todos desligados por padrao. Segredos so no servidor, nunca em commit.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_WRITES_ENABLED: ${WHATSAPP_WRITES_ENABLED:-false}
      WA_AKG_BASE_URL: ${WA_AKG_BASE_URL:-}
      WA_AKG_API_KEY: ${WA_AKG_API_KEY:-}
      WA_AKG_SESSION_ID: ${WA_AKG_SESSION_ID:-}
      WA_AKG_WEBHOOK_SECRET: ${WA_AKG_WEBHOOK_SECRET:-}
      WA_AKG_TIMEOUT_MS: ${WA_AKG_TIMEOUT_MS:-8000}
      WHATSAPP_CONTACT_NUMBER: ${WHATSAPP_CONTACT_NUMBER:-}
      # Telegram: long polling, entao exatamente UMA instancia do backend com TELEGRAM_ENABLED=true.
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_WRITES_ENABLED: ${TELEGRAM_WRITES_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BASE_URL: ${TELEGRAM_BASE_URL:-https://api.telegram.org}
      TELEGRAM_TIMEOUT_MS: ${TELEGRAM_TIMEOUT_MS:-8000}
      TELEGRAM_POLL_TIMEOUT_S: ${TELEGRAM_POLL_TIMEOUT_S:-25}
    ports:
      - '127.0.0.1:${BACKEND_HOST_PORT:-3010}:3000'

  frontend:
    build:
      context: ./frontend
      args:
        FRONTEND_APP_API_BASE_URL: ${FRONTEND_APP_API_BASE_URL}
        FRONTEND_APP_WS_BASE_URL: ${FRONTEND_APP_WS_BASE_URL}
        FRONTEND_APP_MFA_ENABLED: ${FRONTEND_APP_MFA_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${FRONTEND_HOST_PORT:-4210}:80'

volumes:
  postgres-data:
