# Uptime Kuma (status.financelumen.tech). Aplicar em
# /etc/nginx/sites-available/status.conf. Exige o registro A `status` ->
# IP da VPS e o certificado emitido via certbot (webroot /var/www/certbot):
#   certbot certonly --webroot -w /var/www/certbot -d status.financelumen.tech

server {
    listen 80;
    server_name status.financelumen.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name status.financelumen.tech;

    ssl_certificate     /etc/letsencrypt/live/status.financelumen.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.financelumen.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:3030;
        proxy_http_version 1.1;
        # O painel do Kuma usa WebSocket (socket.io).
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
