# Config de producao do Lumen para a VPS (financelumen.tech).
# Aplicado em /etc/nginx/sites-available/financelumen.conf na VPS.
# Segue o mesmo padrao usado pelo Triluga nessa mesma VPS.
#
# Antes de aplicar a versao com SSL abaixo, e preciso obter os certificados
# via certbot (webroot /var/www/certbot), o que exige que o DNS de
# financelumen.tech, www.financelumen.tech e api.financelumen.tech ja
# aponte (registro A) para o IP da VPS.

# Redireciona todo HTTP para HTTPS
server {
    listen 80;
    server_name financelumen.tech www.financelumen.tech api.financelumen.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend — financelumen.tech
server {
    listen 443 ssl;
    server_name financelumen.tech www.financelumen.tech;

    ssl_certificate     /etc/letsencrypt/live/financelumen.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/financelumen.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Headers de seguranca do frontend (a API ja recebe os dela via helmet).
    # HSTS com includeSubDomains: so vale se TODO subdominio de financelumen.tech
    # atende HTTPS; senao remova o includeSubDomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP validada contra o build de producao (10 rotas + service worker, 0 violacoes).
    # Os dois sha256 cobrem o unico <script> inline (tema, frontend/src/index.html) e o
    # onload="this.media='all'" que o Angular injeta no CSS critico. Se o index.html
    # mudar (ou o Angular for atualizado) recalcule com:
    #   node -e "const c=require('crypto'),h=require('fs').readFileSync('frontend/dist/frontend/index.html','utf8');
    #   const f=s=>'sha256-'+c.createHash('sha256').update(s).digest('base64');
    #   console.log([...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>f(m[1])),
    #   [...new Set([...h.matchAll(/onload=\"([^\"]*)\"/g)].map(m=>f(m[1])))])"
    # Sem hash correto o site carrega SEM ESTILO e sem tema.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-vLGOnMejlBHEC6RV10H5/XV1mWvYZvx7DnelE0YLTQ8=' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.financelumen.tech wss://api.financelumen.tech; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location / {
        proxy_pass         http://127.0.0.1:4210;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Backend — api.financelumen.tech
server {
    listen 443 ssl;
    server_name api.financelumen.tech;

    ssl_certificate     /etc/letsencrypt/live/api.financelumen.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.financelumen.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Documentacao Swagger protegida por senha (expor a doc completa da API
    # sem gate facilita reconhecimento de superficie de ataque).
    location /api/docs {
        auth_basic           "Lumen API docs";
        auth_basic_user_file /etc/nginx/htpasswd/lumen-api-docs;
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # REST API
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size 10m;
    }
}
