# Uptime Kuma na VPS (status.financelumen.tech). Preso em 127.0.0.1:3030;
# o nginx do host faz o proxy (ver deploy/nginx/status.conf).
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - '127.0.0.1:3030:3001'

volumes:
  uptime-kuma-data:
