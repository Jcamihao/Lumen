<div class="proto-auth">
  <div class="proto-auth__layout auth-flow-layout">
    <section class="proto-auth-card auth-card">
      <img class="auth-flow-brand" src="assets/logo/lumen-mark.svg" alt="Logo do Lumen" />

      <div class="proto-auth-card__head">
        <h1>Esqueceu sua senha?</h1>
        <p *ngIf="!sent()">
          Informe o email da sua conta e enviaremos um link para criar uma nova senha.
        </p>
      </div>

      <ng-container *ngIf="!sent(); else sentState">
        <form class="proto-auth-form" [formGroup]="form" (ngSubmit)="submit()">
          <div class="proto-field">
            <label for="forgot-email">Email</label>
            <input
              id="forgot-email"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="voce@exemplo.com"
            />
          </div>

          <p class="auth-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

          <div class="proto-actions-row">
            <button
              type="submit"
              class="proto-button auth-actions__primary"
              [disabled]="loading()"
            >
              {{ loading() ? 'Enviando...' : 'Enviar link' }}
            </button>
          </div>
        </form>
      </ng-container>

      <ng-template #sentState>
        <div class="auth-flow-actions">
          <p class="auth-success">Pedido enviado.</p>
          <p class="auth-flow-note">
            Se existir uma conta com esse email, o link chega em alguns minutos e vale por 1
            hora. Confira também a caixa de spam.
          </p>
        </div>
      </ng-template>

      <div class="proto-auth-card__footer">
        <p>
          Lembrou a senha?
          <a class="auth-link" routerLink="/auth/login">Voltar para o login</a>
        </p>
      </div>
    </section>
  </div>
</div>
