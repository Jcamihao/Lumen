<aside class="proto-sidebar" [class.proto-sidebar--mobile]="mobile">
  <div class="proto-sidebar__top">
    <a class="proto-sidebar__brand" routerLink="/dashboard" (click)="requestClose()">
      <span class="proto-sidebar__brand-copy">
        <span>Clareza para sua vida</span>
      </span>
    </a>

    <button
      *ngIf="mobile"
      type="button"
      class="proto-sidebar__close"
      aria-label="Fechar menu"
      (click)="requestClose()"
    >
      <span class="material-symbols-rounded">close</span>
    </button>
  </div>

  <div class="proto-sidebar__status" [attr.data-tone]="syncStatusTone()">
    <span class="proto-sidebar__status-dot"></span>
    <span>{{ syncStatusLabel() }}</span>
    <span class="proto-sidebar__currency">{{ authService.currentUser()?.preferredCurrency || 'BRL' }}</span>
  </div>

  <div class="proto-sidebar__nav-block">
    <p class="section-kicker proto-sidebar__kicker">Módulos principais</p>

    <nav class="proto-sidebar__nav">
      <a
        *ngFor="let item of primaryNavItems"
        class="proto-sidebar__link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        (click)="requestClose()"
      >
        <span class="material-symbols-rounded">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </div>

  <div class="proto-sidebar__nav-block">
    <p class="section-kicker proto-sidebar__kicker">Operações e dados</p>

    <nav class="proto-sidebar__nav">
      <a
        *ngFor="let item of secondaryNavItems"
        class="proto-sidebar__link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        (click)="requestClose()"
      >
        <span class="material-symbols-rounded">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
        <span
          class="proto-sidebar__badge"
          *ngIf="item.route === '/notifications' && notificationCenter.unreadCount() > 0"
        >
          {{ notificationCenter.unreadCount() }}
        </span>
      </a>
    </nav>
  </div>

  <div class="proto-sidebar__nav-block" *ngIf="authService.currentUser()?.role === 'ADMIN'">
    <p class="section-kicker proto-sidebar__kicker">Admin</p>

    <nav class="proto-sidebar__nav">
      <a
        class="proto-sidebar__link"
        routerLink="/admin/support"
        routerLinkActive="active"
        (click)="requestClose()"
      >
        <span class="material-symbols-rounded">support_agent</span>
        <span>Suporte</span>
      </a>
    </nav>
  </div>

  <div class="proto-sidebar__profile">
    <button type="button" class="proto-sidebar__logout" (click)="logout()">
      <span class="material-symbols-rounded">logout</span>
      <span>Sair</span>
    </button>
  </div>
</aside>
