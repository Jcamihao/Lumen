<header class="proto-topbar proto-header--glass">
  <div class="proto-topbar__left">
    <a class="proto-topbar__brand" routerLink="/dashboard">Lumen</a>
    <span class="proto-topbar__crumb-sep">/</span>
    <span class="proto-topbar__crumb">{{ currentPageLabel() }}</span>
  </div>

  <div class="proto-topbar__search">
    <span class="material-symbols-rounded proto-topbar__search-icon">search</span>
    <input
      #searchInput
      type="search"
      class="proto-topbar__search-input"
      placeholder="Buscar em tudo ou perguntar ao Selah..."
      [value]="searchQuery()"
      (input)="searchQuery.set($any($event.target).value)"
      (focus)="onSearchFocus()"
      (blur)="onSearchBlur()"
      (keydown.enter)="askSelahWithQuery()"
      (keydown.escape)="closeSearch()"
    />
    <kbd class="proto-topbar__search-kbd" *ngIf="!searchQuery()">⌘K</kbd>

    <div class="proto-topbar__search-results" *ngIf="searchOpen() && searchQuery().trim().length >= 2">
      <ng-container *ngIf="hasMatches(); else noMatches">
        <p class="proto-topbar__search-group" *ngIf="taskResults().length">Tarefas</p>
        <button
          type="button"
          class="proto-topbar__search-item"
          *ngFor="let task of taskResults()"
          (click)="goToTask(task)"
        >
          <span class="material-symbols-rounded">checklist</span>
          <span class="proto-topbar__search-item-label">{{ task.title }}</span>
        </button>

        <p class="proto-topbar__search-group" *ngIf="transactionResults().length">Transações</p>
        <button
          type="button"
          class="proto-topbar__search-item"
          *ngFor="let transaction of transactionResults()"
          (click)="goToTransaction(transaction)"
        >
          <span class="material-symbols-rounded">account_balance_wallet</span>
          <span class="proto-topbar__search-item-label">{{ transaction.description }}</span>
          <span class="proto-topbar__search-item-amount">
            {{ transaction.amount | currency: currencyCode() : 'symbol' : '1.0-0' : 'pt-BR' }}
          </span>
        </button>

        <p class="proto-topbar__search-group" *ngIf="goalResults().length">Metas</p>
        <button
          type="button"
          class="proto-topbar__search-item"
          *ngFor="let goal of goalResults()"
          (click)="goToGoal(goal)"
        >
          <span class="material-symbols-rounded">flag</span>
          <span class="proto-topbar__search-item-label">{{ goal.title }}</span>
        </button>

        <p class="proto-topbar__search-group" *ngIf="insightResults().length">Leituras do Selah</p>
        <button
          type="button"
          class="proto-topbar__search-item"
          *ngFor="let insight of insightResults()"
          (click)="goToInsight(insight)"
        >
          <span class="material-symbols-rounded">{{ insightIcon(insight.type) }}</span>
          <span class="proto-topbar__search-item-label">{{ insight.message }}</span>
        </button>
      </ng-container>

      <ng-template #noMatches>
        <p class="proto-topbar__search-empty">Sem resultados em tarefas, transações, metas ou leituras do Selah.</p>
      </ng-template>

      <button type="button" class="proto-topbar__search-item proto-topbar__search-item--selah" (click)="askSelahWithQuery()">
        <span class="material-symbols-rounded">auto_awesome</span>
        <span class="proto-topbar__search-item-label">Perguntar ao Selah: "{{ searchQuery() }}"</span>
      </button>
    </div>
  </div>

  <div class="proto-topbar__actions">
    <a class="proto-topbar__icon-button" routerLink="/notifications" aria-label="Alertas">
      <span class="material-symbols-rounded">notifications</span>
      <span class="proto-topbar__badge" *ngIf="notificationCenter.unreadCount() > 0">
        {{ notificationCenter.unreadCount() }}
      </span>
    </a>

    <a class="proto-button proto-topbar__cta" routerLink="/assistant">
      <span class="material-symbols-rounded">auto_awesome</span>
      <span class="proto-topbar__cta-label">Perguntar ao Selah</span>
    </a>

    <app-theme-toggle></app-theme-toggle>

    <span class="proto-topbar__divider"></span>

    <a class="proto-topbar__avatar" routerLink="/settings" aria-label="Configurações da conta">
      <img *ngIf="authService.currentUser()?.avatarUrl as avatar; else fallbackInitials" [src]="avatar" alt="" />
      <ng-template #fallbackInitials>
        <span>{{ userInitials() }}</span>
      </ng-template>
    </a>
  </div>
</header>
